name: Desktop builds
on:
  pull_request:
    paths: ['desktop/**', 'workload/**', 'sql/preflight.sql', 'sql/inventory.sql', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: macos-latest
            runtime: osx-arm64
          - os: macos-latest
            runtime: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore desktop/Stackish.slnx --locked-mode
      - run: dotnet test desktop/Stackish.Tests -c Release --no-restore
      - run: dotnet run --project desktop/Stackish.Preview -c Release -- desktop/artifacts/screenshots
      - run: python desktop/package.py --runtime ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        with:
          name: stackish-${{ matrix.runtime }}-unsigned
          path: |
            desktop/artifacts/${{ matrix.runtime }}/*.zip
            desktop/artifacts/screenshots/*.png
